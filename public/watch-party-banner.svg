<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Watch Party — Watch together. Stay in sync.</title>
  <desc id="desc">A dark midnight-blue banner with a violet and cyan cinematic play symbol and subtle orbital rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="0.58" stop-color="#10162c"/>
      <stop offset="1" stop-color="#21143b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="290" fill="url(#glow)"/>
  <g fill="none" stroke="#a5b4fc" stroke-opacity=".13">
    <circle cx="970" cy="180" r="90"/>
    <circle cx="970" cy="180" r="130"/>
    <circle cx="970" cy="180" r="170"/>
    <path d="M760 180h420M970 0v360"/>
  </g>
  <g transform="translate(880 105)">
    <rect x="0" y="0" width="150" height="150" rx="38" fill="#ffffff" fill-opacity=".045" stroke="#c4b5fd" stroke-opacity=".28"/>
    <path d="M59 42c-5-3-11 1-11 7v52c0 6 6 10 11 7l43-26c5-3 5-11 0-14z" fill="url(#accent)"/>
    <circle cx="117" cy="34" r="7" fill="#67e8f9"/>
    <circle cx="31" cy="118" r="5" fill="#a78bfa"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="82" y="100" fill="#c4b5fd" font-size="15" font-weight="700" letter-spacing="4">REAL-TIME SOCIAL PLAYBACK</text>
    <text x="78" y="177" fill="#f8fafc" font-size="66" font-weight="750" letter-spacing="-2">Watch Party</text>
    <text x="83" y="222" fill="#cbd5e1" font-size="25" font-weight="450">Watch together. Stay in sync.</text>
    <g transform="translate(84 267)" font-size="13" font-weight="650">
      <rect width="108" height="30" rx="15" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".5"/>
      <text x="54" y="19" text-anchor="middle" fill="#ddd6fe">NEXT.JS</text>
      <rect x="120" width="122" height="30" rx="15" fill="#67e8f9" fill-opacity=".10" stroke="#67e8f9" stroke-opacity=".45"/>
      <text x="181" y="19" text-anchor="middle" fill="#a5f3fc">SOCKET.IO</text>
      <rect x="254" width="126" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="317" y="19" text-anchor="middle" fill="#e2e8f0">TYPESCRIPT</text>
    </g>
  </g>
